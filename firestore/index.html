<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citas médicas · No relacional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/comun/styles.css">
</head>
<body>
  <div id="app"><p class="cargando">Conectando con la base de datos…</p></div>
  <script type="module">
    try {
      const { db } = await import('/firestore/db.js');
      const { iniciarApp } = await import('/comun/app.js');
      iniciarApp(db, { version: 'No relacional', motor: 'Cloud Firestore (Firebase)', otra: '/relacional/', otraNombre: 'relacional' });
    } catch (e) {
      document.getElementById('app').innerHTML =
        '<div class="panel error-config"><div><h2>Falta configurar la base de datos</h2><p>' + e.message +
        '</p><p>Edite <code>firestore/config.js</code> con los datos de su proyecto.</p></div></div>';
    }
  </script>
</body>
</html>
